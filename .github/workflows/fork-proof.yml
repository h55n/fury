# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: FURY1398 fork proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fury1398-fork-proof
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
        platform: [x64]
        install-type: [pip, ]  # conda]
        depends: [DEFAULT_DEPS, OPTIONAL_DEPS]
        coverage: [false]
        use-pre: [false]
    env:
      INSTALL_TYPE: ${{ matrix.install-type }}
      DEPENDS: ${{ matrix.depends }}
      PYTHON_VERSION: ${{ matrix.python-version }}
      VENV_ARGS: "--python=python"
      USE_PRE: ${{ matrix.use-pre }}
      COVERAGE: ${{ matrix.coverage }}
      PRE_WHEELS: "https://pypi.anaconda.org/scipy-wheels-nightly/simple"
      QT_QPA_PLATFORM: "offscreen"
      FURY_OFFSCREEN: true
      FURY_WERRORS: true
      # EAGER_IMPORT: 1  # to explore what is the issue.


    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set PYGFX_DEFAULT_PPAA
      if: startsWith(matrix.os, 'windows')
      run: |
        echo "PYGFX_DEFAULT_PPAA=none" >> $GITHUB_ENV
    - name: Set up Virtualenv
      if: ${{ matrix.install-type != 'conda' }}
      run: |
        python -m pip install --upgrade pip virtualenv
        virtualenv $VENV_ARGS venv
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4
      if: ${{ matrix.install-type == 'conda' }}
      with:
        auto-update-conda: true
        auto-activate-base: false
        activate-environment: venv
        python-version: ${{ matrix.python-version }}
        channels: defaults, conda-forge
        use-only-tar-bz2: true
    - name: Setup Headless
      run: ci/setup_headless.sh
    - name: Install Dependencies
      run: ci/install_dependencies.sh
    - name: Install FURY
      run: ci/install.sh
    - name: Run the tests!
      run: ci/run_tests.sh
